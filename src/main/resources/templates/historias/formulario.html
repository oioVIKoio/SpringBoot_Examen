<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Historia Clínica</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h2 th:text="${historiaForm.id == null ? 'Registrar Historia Clínica' : 'Modificar Historia Clínica'}">Registrar Historia Clínica</h2>
        </div>

        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/historias/guardar}" th:object="${historiaForm}" method="post" novalidate>

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="paciente" class="form-label">Paciente</label>

                        <select th:if="${historiaForm.id == null}" id="paciente" class="form-select" th:field="*{pacienteId}">
                            <option value="">Seleccione un paciente</option>
                            <option th:each="p : ${pacientes}" th:value="${p.id}"
                                    th:text="${p.nombreCompleto + ' - ' + p.dni}"></option>
                        </select>

                        <input th:if="${historiaForm.id != null}" type="text" class="form-control" readonly
                               th:value="${paciente.nombreCompleto + ' - ' + paciente.dni}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input type="date" id="fecha" class="form-control" th:field="*{fecha}"
                               th:classappend="${#fields.hasErrors('fecha')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fecha}"></div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label for="diagnostico" class="form-label">Diagnóstico</label>
                        <textarea id="diagnostico" class="form-control" rows="3" th:field="*{diagnostico}" maxlength="500"
                                  th:classappend="${#fields.hasErrors('diagnostico')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback" th:errors="*{diagnostico}"></div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label for="tratamiento" class="form-label">Tratamiento</label>
                        <textarea id="tratamiento" class="form-control" rows="3" th:field="*{tratamiento}" maxlength="500"
                                  th:classappend="${#fields.hasErrors('tratamiento')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback" th:errors="*{tratamiento}"></div>
                    </div>

                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/historias}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
