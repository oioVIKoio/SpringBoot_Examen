<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Pacientes</h2>
        <div>
            <a th:href="@{/}" class="btn btn-secondary">Inicio</a>
            <a th:href="@{/pacientes/nuevo}" class="btn btn-primary">Nuevo Paciente</a>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive">
    <table class="table table-bordered table-hover bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>DNI</th>
            <th>Paciente</th>
            <th>Nacimiento</th>
            <th>Teléfono</th>
            <th>Citas</th>
            <th>Historia clínica</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="paciente : ${pacientes}">
            <td th:text="${paciente.id}"></td>
            <td th:text="${paciente.dni}"></td>
            <td th:text="${paciente.nombreCompleto}"></td>
            <td th:text="${#temporals.format(paciente.fechaNacimiento, 'dd/MM/yyyy')}"></td>
            <td th:text="${paciente.telefono}"></td>
            <td th:text="${#lists.size(paciente.citas)}"></td>
            <td>
                <span th:if="${paciente.historia != null}" class="badge bg-info text-dark">Sí</span>
                <span th:if="${paciente.historia == null}" class="badge bg-secondary">No</span>
            </td>
            <td>
                <span th:if="${paciente.activo}" class="badge bg-success">Activo</span>
                <span th:unless="${paciente.activo}" class="badge bg-danger">Inactivo</span>
            </td>
            <td class="d-flex gap-1">
                <a th:href="@{'/pacientes/editar/' + ${paciente.id}}" class="btn btn-warning btn-sm">Editar</a>

                <a th:if="${paciente.activo}"
                   th:href="@{'/pacientes/desactivar/' + ${paciente.id}}"
                   class="btn btn-danger btn-sm">Desactivar</a>

                <a th:unless="${paciente.activo}"
                   th:href="@{'/pacientes/activar/' + ${paciente.id}}"
                   class="btn btn-success btn-sm">Activar</a>

                <form th:action="@{'/pacientes/eliminar/' + ${paciente.id}}" method="post"
                      onsubmit="return confirm('¿Eliminar este paciente?');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pacientes)}">
            <td colspan="9" class="text-center text-muted">No hay pacientes registrados</td>
        </tr>
        </tbody>
    </table>
    </div>

</div>

</body>
</html>
