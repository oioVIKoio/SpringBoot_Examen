<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Paciente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h2 th:text="${pacienteForm.id == null ? 'Registrar Paciente' : 'Modificar Paciente'}">Registrar Paciente</h2>
        </div>

        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/pacientes/guardar}" th:object="${pacienteForm}" method="post" novalidate>

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label for="dni" class="form-label">DNI</label>
                        <input type="text" id="dni" class="form-control" th:field="*{dni}" maxlength="8"
                               th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{dni}"></div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="nombres" class="form-label">Nombres</label>
                        <input type="text" id="nombres" class="form-control" th:field="*{nombres}"
                               th:classappend="${#fields.hasErrors('nombres')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nombres}"></div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="apellidos" class="form-label">Apellidos</label>
                        <input type="text" id="apellidos" class="form-control" th:field="*{apellidos}"
                               th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                        <input type="date" id="fechaNacimiento" class="form-control" th:field="*{fechaNacimiento}"
                               th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fechaNacimiento}"></div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="text" id="telefono" class="form-control" th:field="*{telefono}" maxlength="9"
                               th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{telefono}"></div>
                    </div>

                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/pacientes}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
