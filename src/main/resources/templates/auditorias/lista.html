<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bitácora de Auditoría</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Bitácora de Auditoría</h2>

        <a th:href="@{/}"
           class="btn btn-secondary">
            Volver
        </a>

    </div>

    <table class="table table-bordered table-hover bg-white">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Usuario</th>
            <th>Acción</th>
            <th>Módulo</th>
            <th>Entidad</th>
            <th>ID registro</th>
            <th>Descripción</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="auditoria : ${auditorias}">

            <td th:text="${auditoria.id}"></td>

            <td th:text="${#temporals.format(
                    auditoria.fecha,
                    'dd/MM/yyyy HH:mm:ss')}">
            </td>

            <td th:text="${auditoria.usuario.usuario}">
            </td>

            <td th:text="${auditoria.accion}">
            </td>

            <td th:text="${auditoria.modulo}">
            </td>

            <td th:text="${auditoria.entidad}">
            </td>

            <td th:text="${auditoria.entidadId}">
            </td>

            <td th:text="${auditoria.descripcion}">
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
