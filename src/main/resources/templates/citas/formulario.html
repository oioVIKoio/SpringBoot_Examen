<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Cita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h2 th:text="${citaForm.id == null ? 'Registrar Cita' : 'Modificar Cita'}">Registrar Cita</h2>
        </div>

        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${#lists.isEmpty(medicos)}" class="alert alert-warning">
                No hay médicos activos: asigne el rol MEDICO a un usuario.
            </div>

            <form th:action="@{/citas/guardar}" th:object="${citaForm}" method="post" novalidate>

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="paciente" class="form-label">Paciente</label>
                        <select id="paciente" class="form-select" th:field="*{pacienteId}"
                                th:classappend="${#fields.hasErrors('pacienteId')} ? 'is-invalid'">
                            <option value="">Seleccione un paciente</option>
                            <option th:each="p : ${pacientes}" th:value="${p.id}"
                                    th:text="${p.nombreCompleto + ' - ' + p.dni + (p.activo ? '' : ' (inactivo)')}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{pacienteId}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="medico" class="form-label">Médico</label>
                        <select id="medico" class="form-select" th:field="*{medicoId}"
                                th:classappend="${#fields.hasErrors('medicoId')} ? 'is-invalid'">
                            <option value="">Seleccione un médico</option>
                            <option th:each="m : ${medicos}" th:value="${m.id}"
                                    th:text="${m.nombres + ' ' + m.apellidos}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{medicoId}"></div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="fechaHora" class="form-label">Fecha y hora</label>
                        <input type="datetime-local" id="fechaHora" class="form-control" th:field="*{fechaHora}"
                               th:classappend="${#fields.hasErrors('fechaHora')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fechaHora}"></div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select id="estado" class="form-select" th:field="*{estado}">
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label for="motivo" class="form-label">Motivo</label>
                        <input type="text" id="motivo" class="form-control" th:field="*{motivo}" maxlength="200"
                               th:classappend="${#fields.hasErrors('motivo')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{motivo}"></div>
                    </div>

                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/citas}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
