<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Citas</h2>
        <div>
            <a th:href="@{/}" class="btn btn-secondary">Inicio</a>
            <a th:href="@{/citas/nuevo}" class="btn btn-primary"
               sec:authorize="hasAuthority('CITAS_CREAR')">Nueva Cita</a>
        </div>
    </div>

    <div class="table-responsive">
    <table class="table table-bordered table-hover bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Fecha y hora</th>
            <th>Paciente</th>
            <th>Médico</th>
            <th>Motivo</th>
            <th>Estado</th>
            <th sec:authorize="hasAuthority('CITAS_EDITAR')">Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="cita : ${citas}">
            <td th:text="${cita.id}"></td>
            <td th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${cita.paciente.nombreCompleto + ' (' + cita.paciente.dni + ')'}"></td>
            <td th:text="${cita.medico.nombres + ' ' + cita.medico.apellidos}"></td>
            <td th:text="${cita.motivo}"></td>
            <td>
                <span class="badge"
                      th:classappend="${cita.estado.name() == 'PROGRAMADA'} ? 'bg-primary' : (${cita.estado.name() == 'ATENDIDA'} ? 'bg-success' : 'bg-secondary')"
                      th:text="${cita.estado}"></span>
            </td>
            <td class="d-flex gap-1" sec:authorize="hasAuthority('CITAS_EDITAR')">
                <a th:href="@{'/citas/editar/' + ${cita.id}}" class="btn btn-warning btn-sm">Editar</a>

                <form th:action="@{'/citas/eliminar/' + ${cita.id}}" method="post"
                      onsubmit="return confirm('¿Eliminar esta cita?');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(citas)}">
            <td colspan="7" class="text-center text-muted">No hay citas registradas</td>
        </tr>
        </tbody>
    </table>
    </div>

</div>

</body>
</html>
