<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Usuarios</h2>
        <a th:href="@{/usuarios/nuevo}"
           class="btn btn-primary"
           sec:authorize="hasAuthority('USUARIOS_CREAR')">
            Nuevo Usuario
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/usuarios}" method="get" class="mb-4">

        <div class="row g-2">

            <div class="col-md-5">
                <input type="text"
                       name="termino"
                       class="form-control"
                       placeholder="Buscar por nombre, DNI, correo o usuario..."
                       th:value="${termino}">
            </div>

            <div class="col-md-3">
                <select name="rolId" class="form-select">
                    <option value="">Todos los roles</option>

                    <option th:each="rol : ${roles}"
                            th:value="${rol.id}"
                            th:text="${rol.nombre}"
                            th:selected="${rolId != null and rol.id == rolId}">
                    </option>
                </select>
            </div>

            <div class="col-md-2">
                <select name="activo" class="form-select">
                    <option value="">Todos los estados</option>

                    <option value="true"
                            th:selected="${activo != null and activo}">
                        Activo
                    </option>

                    <option value="false"
                            th:selected="${activo != null and !activo}">
                        Inactivo
                    </option>
                </select>
            </div>

            <div class="col-md-2 d-flex gap-2">
                <button type="submit"
                        class="btn btn-primary flex-fill">
                    Buscar
                </button>

                <a th:href="@{/usuarios}"
                   class="btn btn-secondary">
                    Limpiar
                </a>
            </div>

        </div>

    </form>
    <table class="table table-bordered table-hover bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>DNI</th>
            <th>Correo</th>
            <th>Área</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.id}"></td>
            <td th:text="${usuario.nombres + ' ' + usuario.apellidos}"></td>
            <td th:text="${usuario.dni}"></td>
            <td th:text="${usuario.correo}"></td>
            <td th:text="${usuario.area}"></td>

            <td>
                <span th:if="${usuario.activo}" class="badge bg-success">Activo</span>
                <span th:unless="${usuario.activo}" class="badge bg-danger">Inactivo</span>
            </td>

            <td>

                <a th:href="@{'/usuarios/editar/' + ${usuario.id}}"
                   class="btn btn-warning btn-sm"
                   sec:authorize="hasAuthority('USUARIOS_EDITAR')">
                    Editar
                </a>

                <a th:href="@{'/usuarios/roles/' + ${usuario.id}}"
                   class="btn btn-info btn-sm"
                   sec:authorize="hasAuthority('USUARIOS_ROLES')">
                    Roles
                </a>

                <a th:if="${usuario.activo and usuario.usuario != #authentication.name}"
                   th:href="@{'/usuarios/desactivar/' + ${usuario.id}}"
                   class="btn btn-danger btn-sm"
                   sec:authorize="hasAuthority('USUARIOS_ESTADO')">
                    Desactivar
                </a>

                <a th:unless="${usuario.activo}"
                   th:href="@{'/usuarios/activar/' + ${usuario.id}}"
                   class="btn btn-success btn-sm"
                   sec:authorize="hasAuthority('USUARIOS_ESTADO')">
                    Activar
                </a>

            </td>
        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
