<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Roles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h2>Asignar Roles</h2>
        </div>

        <div class="card-body">

            <p>
                Usuario:
                <strong th:text="${usuario.nombres + ' ' + usuario.apellidos}">
                    Usuario
                </strong>
            </p>

            <form th:action="@{/usuarios/roles/guardar}" method="post">

                <input type="hidden"
                       name="usuarioId"
                       th:value="${usuario.id}">

                <div th:each="rol : ${roles}" class="form-check mb-2">

                    <input class="form-check-input"
                           type="checkbox"
                           name="rolesIds"
                           th:id="'rol-' + ${rol.id}"
                           th:value="${rol.id}"
                           th:checked="${usuario.roles.contains(rol)}">

                    <label class="form-check-label"
                           th:for="'rol-' + ${rol.id}">
                        <span th:text="${rol.nombre}">Rol</span>
                        <span th:unless="${rol.activo}" class="badge bg-secondary">Inactivo</span>
                    </label>

                </div>

                <div class="mt-4">

                    <button type="submit" class="btn btn-primary">
                        Guardar roles
                    </button>

                    <a th:href="@{/usuarios}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
