<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Roles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Roles</h2>

        <a th:href="@{/roles/nuevo}"
           class="btn btn-primary"
           sec:authorize="hasAuthority('ROLES_CREAR')">
            Nuevo Rol
        </a>
    </div>

    <table class="table table-bordered table-hover bg-white">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="rol : ${roles}">

            <td th:text="${rol.id}"></td>

            <td th:text="${rol.nombre}"></td>

            <td th:text="${rol.descripcion}"></td>

            <td>
                <span th:if="${rol.activo}" class="badge bg-success">Activo</span>
                <span th:unless="${rol.activo}" class="badge bg-danger">Inactivo</span>
            </td>

            <td>

                <a th:href="@{'/roles/editar/' + ${rol.id}}"
                   class="btn btn-warning btn-sm"
                   sec:authorize="hasAuthority('ROLES_EDITAR')">
                    Editar
                </a>

                <a th:href="@{'/roles/permisos/' + ${rol.id}}"
                   class="btn btn-info btn-sm"
                   sec:authorize="hasAuthority('ROLES_PERMISOS')">
                    Permisos
                </a>

                <a th:if="${rol.activo}"
                   th:href="@{'/roles/desactivar/' + ${rol.id}}"
                   class="btn btn-danger btn-sm"
                   sec:authorize="hasAuthority('ROLES_ESTADO')">
                    Desactivar
                </a>

                <a th:unless="${rol.activo}"
                   th:href="@{'/roles/activar/' + ${rol.id}}"
                   class="btn btn-success btn-sm"
                   sec:authorize="hasAuthority('ROLES_ESTADO')">
                    Activar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <a th:href="@{/}" class="btn btn-secondary">
        Volver
    </a>

</div>

</body>
</html>
