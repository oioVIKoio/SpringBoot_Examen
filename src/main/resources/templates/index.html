<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Hospitalario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark pe-3 ps-3">
    <span class="navbar-brand">Sistema Hospitalario</span>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
    </form>
</nav>

<div class="container mt-5">
    <h2>Bienvenido al Panel Principal</h2>
    <p class="lead">
        Has iniciado sesión como <strong sec:authentication="name">usuario</strong>.
    </p>

    <!-- Cada rol ve solo los módulos que tiene permitidos -->
    <div class="list-group mt-4">
        <a th:href="@{/pacientes}" class="list-group-item list-group-item-action"
           sec:authorize="hasAuthority('PACIENTES_VER')">Pacientes</a>
        <a th:href="@{/citas}" class="list-group-item list-group-item-action"
           sec:authorize="hasAuthority('CITAS_VER')">Citas</a>
        <a th:href="@{/historias}" class="list-group-item list-group-item-action"
           sec:authorize="hasAuthority('HISTORIAS_VER')">Historias clínicas</a>
        <a th:href="@{/usuarios}" class="list-group-item list-group-item-action"
           sec:authorize="hasAuthority('USUARIOS_VER')">Usuarios</a>
        <a th:href="@{/roles}" class="list-group-item list-group-item-action"
           sec:authorize="hasAuthority('ROLES_VER')">Roles</a>
        <a th:href="@{/permisos}" class="list-group-item list-group-item-action"
           sec:authorize="hasAuthority('PERMISOS_VER')">Permisos</a>
        <a th:href="@{/auditorias}" class="list-group-item list-group-item-action"
           sec:authorize="hasRole('ADMINISTRADOR')">Auditoría</a>
    </div>
</div>
</body>
</html>
